<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết CLB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        #header {
            position: sticky;
            top: 0;
            z-index: 999;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .form-container {
            background-color: #f9f9f9;
        }

        .images img,
        #preview,
        #previews {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .image-wrapper {
            position: relative;
            width: 150px;
            height: 150px;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        #imagePreview {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            max-height: 280px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #fff;
        }

        .club-info-label {
            font-weight: bold;
        }

        .club-img-shadow {
            border-radius: 8px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .club-img-shadow:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

    </style>
</head>
<body>
<div id="header" th:replace="fragments/user/header_user :: header"></div>

<div class="container mt-5">
    <h2 class="text-center mb-5">Chi tiết Câu Lạc Bộ</h2>

    <div style="margin-top: -20px">
        <a th:href="@{/}">
            <i class="bi bi-arrow-bar-left"></i> Quay lại
        </a>
    </div>

    <form th:object="${club}" method="post" enctype="multipart/form-data"
          class="form-container border rounded p-4 shadow-lg">

        <input type="hidden" th:field="*{club_id}"/>
        <input type="hidden" th:field="*{user.name}"/>



        <div class="row mb-4">
            <!-- Cột ảnh -->
            <div class="col-md-4">
                <div class="mb-4">
                    <label class="form-label club-info-label">Ảnh đại diện</label>
                    <img id="preview" th:src="@{'/uploadFile/' + *{image}}" alt="Ảnh đại diện"
                         class="img-fluid rounded shadow-sm club-img-shadow">
                </div>

                <div class="mb-4">
                    <label class="form-label club-info-label">Ảnh bìa</label>
                    <img id="previews" th:src="@{'/uploadFile/' + *{cover_image}}" alt="Ảnh bìa"
                         class="img-fluid rounded shadow-sm club-img-shadow">
                </div>
            </div>

            <!-- Cột thông tin -->
            <div class="col-md-8">
                <div class="mb-3">
                    <h1 style="margin-top: 20px;font-size: 3em" class="card-title mb-1 text-truncate"
                        th:text="${club.name}"></h1>
                </div>

                <div class="mb-3">
                    <p class="card-text d-flex align-items-center fs-4 mb-0">
                        <strong class="me-3">Thể loại:</strong>
                        <span class="text-success text-truncate" th:text="${club.type}"></span>
                    </p>
                </div>


                <div class="d-flex justify-content-between align-items-start w-100">
                    <div>
                        <p class="card-text mb-4 fs-4 d-flex align-items-center">
                            <i class="bi bi-geo-alt-fill text-danger me-2 fs-4"></i>
                            <span class="text-truncate" style="max-width: 100%;" th:text="${club.address}"></span>
                        </p>
                        <p class="card-text mb-4 fs-4 d-flex align-items-center">
                            <i class="bi bi-clock-fill text-primary me-2 fs-4"></i>
                            <span th:text="${club.open_time}"></span>
                            &nbsp;-&nbsp;
                            <span th:text="${club.close_time}"></span>
                        </p>
                        <p class="card-text mb-4 fs-4 d-flex align-items-center">
                            <i class="bi bi-telephone-fill text-success me-2 fs-4"></i>
                            <span th:text="${club.user.phone}"></span>
                        </p>
                    </div>


                </div>
                <div style="padding-right: 10px;text-align: center">
                    <a th:href="@{'/home/dat?club_id=' + ${club.club_id}}" type="button"
                       class="btn btn-outline-success btn-sm fs-4 px-4 py-2">Đặt lịch</a>
                </div>
            </div>
        </div>
    </form>

    <div class="mt-4">
        <h5 class="mb-3">Hình ảnh sân câu lạc bộ</h5>
        <div >
            <div th:if="${imageUrls != null and !#lists.isEmpty(imageUrls)}" id="imagePreview" class="form-container border rounded p-4 shadow-lg">
                <div class="image-wrapper" th:each="img : ${imageUrls}" >
                    <img th:src="@{'/uploadFile/' + ${img.link}}" alt="Ảnh đã lưu" class="club-img-shadow" style="width: 150px; height: 150px; object-fit: cover; border-radius: 8px;">
                </div>
            </div>

            <div th:if="${imageUrls == null or #lists.isEmpty(imageUrls)}" class="text-center text-muted fst-italic" style="padding: 40px 0;">
                Chưa có hình ảnh nào
            </div>
        </div>
    </div>
</div>

<div th:replace="fragments/user/bottom_user :: bottom"></div>
</body>
</html>
