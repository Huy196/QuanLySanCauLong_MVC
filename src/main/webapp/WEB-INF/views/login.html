<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }



        body {
            background-color: #f4f7fa;
            background-image: url('https://img.lovepik.com/photo/40012/8543.jpg_wh860.jpg');
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000; /* Màu chữ toàn bộ */
        }

        .login-container {
            background-color: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 700px;
        }

        h2 {
            text-align: center;
            font-size: 32px;
            color: #000;
            margin-bottom: 20px;
        }

        h3 {
            text-align: center;
            font-size: 20px;
            color: #000;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 18px;
            color: #000;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            border: 1px solid #999;
            border-radius: 6px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #45a049;
        }

        .link {
            display: block;
            text-align: center;
            margin-top: 12px;
            font-size: 16px;
            color: #1a73e8;
            text-decoration: none;
        }

        .link:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 16px;
            color: #000;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 69%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #333;
        }

    </style>
</head>
<body >
<div class="login-container" >
    <h2>Đăng nhập</h2>
    <h3>DQH - Đặt lịch online sân thể thao</h3>

    <form th:action="@{/login}" th:object="${user}">
        <div class="form-group">
            <label for="emailOrPhone">Số điện thoại hoặc email</label>
            <input th:field="*{email}" type="text" id="emailOrPhone" placeholder="Nhập số điện thoại hoặc email">
        </div>
        <div class="form-group" style="position: relative;">
            <label for="password">Mật khẩu</label>
            <input th:field="*{password}" type="password" id="password" placeholder="Nhập mật khẩu">
            <i class="fas fa-eye password-toggle" id="togglePassword" onclick="togglePassword()"></i>
        </div>

        <button type="submit" class="btn-submit">ĐĂNG NHẬP</button>
    </form>

    <a th:href="@{/}" class="link">Quên mật khẩu?</a>
    <div class="footer">
        <p>Bạn chưa có tài khoản? <a th:href="@{/signIn}" class="link">Đăng ký ngay</a></p>
    </div>
</div>

<script>
    function togglePassword() {
        const passwordField = document.getElementById("password");
        const passwordIcon = document.getElementById("togglePassword");

        if (passwordField.type === "password") {
            passwordField.type = "text";
            passwordIcon.classList.remove("fa-eye");
            passwordIcon.classList.add("fa-eye-slash");
        } else {
            passwordField.type = "password";
            passwordIcon.classList.remove("fa-eye-slash");
            passwordIcon.classList.add("fa-eye");
        }
    }

</script>

</body>
</html>
