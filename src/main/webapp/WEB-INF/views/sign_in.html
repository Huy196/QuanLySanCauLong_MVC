<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:charset="UTF-8" lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Đăng Ký</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f4f7fa;
            background-image: url('https://img.lovepik.com/photo/40012/8543.jpg_wh860.jpg');
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000; /* Màu chữ toàn bộ */
        }

        .login-container {
            background-color: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 700px;
        }

        h2 {
            text-align: center;
            font-size: 32px;
            color: #000;
            margin-bottom: 20px;
        }

        h3 {
            text-align: center;
            font-size: 20px;
            color: #000;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 18px;
            color: #000;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            border: 1px solid #999;
            border-radius: 6px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #45a049;
        }

        .link {
            display: block;
            text-align: center;
            margin-top: 12px;
            font-size: 16px;
            color: #1a73e8;
            text-decoration: none;
        }

        .link:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 16px;
            color: #000;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 69%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #333;
        }
        .error-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 20px;
            font-size: 18px;
            border-radius: 8px;
            text-align: center;
            z-index: 9999;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Đăng ký</h2>
    <h3>DQH - Đặt lịch online sân thể thao</h3>

    <form th:action="@{/saveUser}" th:object="${user}" method="post" id="register-form">
        <div class="form-group">
            <label for="email">Email</label>
            <input th:field="*{email}" type="email" id="email" placeholder="Nhập email" required>
        </div>

        <div class="form-group">
            <label for="name">Tên đầy đủ</label>
            <input th:field="*{name}" type="text" id="name" placeholder="Nhập tên đầy đủ" required>
        </div>

        <div class="form-group">
            <label for="phone">Số điện thoại</label>
            <input th:field="*{phone}" type="text" id="phone" placeholder="Nhập số điện thoại" required>
        </div>

        <div class="form-group" style="position: relative;">
            <label for="password">Mật khẩu</label>
            <input th:field="*{password}" type="password" id="password" placeholder="Nhập mật khẩu" required>
            <i class="fas fa-eye password-toggle" onclick="togglePassword('password', this)"></i>
        </div>

        <div class="form-group" style="position: relative;">
            <label for="confirmPassword">Nhập lại mật khẩu</label>
            <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
            <i class="fas fa-eye password-toggle" onclick="togglePassword('confirmPassword', this)"></i>
        </div>

        <button type="submit" class="btn-submit">ĐĂNG KÝ</button>
    </form>

    <div class="footer">
        <p>Đã có tài khoản? <a th:href="@{/login}" class="link">Đăng nhập</a></p>
    </div>
</div>
<div id="error-message" class="error-message"></div>


<script>
    document.getElementById('register-form').addEventListener('submit', function(event) {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            showErrorMessage("Mật khẩu và mật khẩu xác nhận không trùng khớp!");
            event.preventDefault();
        }
    });

    function showErrorMessage(message) {
        const errorMessageElement = document.getElementById('error-message');
        errorMessageElement.innerText = message;
        errorMessageElement.style.display = "block";

        setTimeout(function() {
            errorMessageElement.style.display = "none";
        }, 3000);
    }
    function togglePassword(id, icon) {
        const field = document.getElementById(id);
        if (field.type === "password") {
            field.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            field.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }
</script>
<script th:if="${session.registrationSuccess}">
    Swal.fire({
        title: 'Đăng ký thành công!',
        text: 'Bạn có thể đăng nhập ngay bây giờ.',
        icon: 'success',
        timer: 2000,
        timerProgressBar: true,
        showConfirmButton: false
    }).then(function() {
        window.location.href = '/login'; // Chuyển hướng lại về trang login
    });
    th:remove="session.registrationSuccess"
</script>
</body>
</html>
