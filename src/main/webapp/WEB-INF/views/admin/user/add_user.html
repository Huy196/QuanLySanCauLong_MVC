<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:charset="UTF-8" lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../js/logout.js"></script>
    <style>
        .header {
            width: 100%;
            margin-left: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        .login-container {
            background-color: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            margin-top: 20px;
            margin: auto;
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 150vh;
        }

        h2 {
            text-align: center;
            font-size: 32px;
            color: #000;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            color: #000;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 18px;
            color: #000;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            border: 1px solid #999;
            border-radius: 6px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #45a049;
        }

        .link {
            display: block;
            text-align: center;
            margin-top: 12px;
            font-size: 16px;
            color: #1a73e8;
            text-decoration: none;
        }

        .link:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 16px;
            color: #000;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 69%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #333;
        }

        .error-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 20px;
            font-size: 18px;
            border-radius: 8px;
            text-align: center;
            z-index: 9999;
        }

        #preview {
            width: 400px;
            height: 400px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 10px;
        }

    </style>
</head>
<body>
<div style="display: flex;padding: 15px">

    <div class="nav-3" id="nav-3">
        <nav th:replace="fragments/admin/nav3_admin :: footer"></nav>
    </div>
    <div class="header" style="width: 100%; margin-left: 10px;">
        <header th:replace="fragments/admin/header_admin :: header"></header>

        <div class="login-container" style="margin-top: 5px">
            <h1><b>Thêm người dùng</b></h1>
            <div style="margin-top: -20px">
                <a th:href="@{'/user/getAllUser'}">
                    <i class="bi bi-arrow-bar-left"></i>Quay lại
                </a>
            </div>

            <form th:action="@{/user/updateUser}" th:object="${user}" method="post" id="register-form"
                  enctype="multipart/form-data"
                  style="display: flex">
                <div style="width: 50vh;margin: auto">
                    <div class="mb-3">
                        <label class="form-label">Ảnh đại diện</label>
                        <div style="text-align: center; display: block">
                            <img id="preview"
                                 th:src="@{'/uploadFile/' + *{image}}"
                                 style="margin-top:10px;margin-bottom: 10px"
                                 alt="Ảnh đại diện"/>
                        </div>
                        <input type="file" name="imageFile" class="form-control mt-2" id="image">
                    </div>
                </div>
                <div style="width: 80vh">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input th:field="*{email}" type="email" id="email" placeholder="Nhập email" required>
                    </div>

                    <div class="form-group">
                        <label for="name">Tên đầy đủ</label>
                        <input th:field="*{name}" type="text" id="name" placeholder="Nhập tên đầy đủ" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Số điện thoại</label>
                        <input th:field="*{phone}" type="text" id="phone" placeholder="Nhập số điện thoại" required>
                    </div>

                    <div class="form-group" style="position: relative;">
                        <label for="password">Mật khẩu</label>
                        <input th:field="*{password}" type="password" id="password" placeholder="Nhập mật khẩu"
                               required>
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('password', this)"></i>
                    </div>

                    <div class="form-group" style="position: relative;">
                        <label for="confirmPassword">Nhập lại mật khẩu</label>
                        <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('confirmPassword', this)"></i>
                    </div>
                    <div style="display: flex;gap: 10px">
                        <button type="submit" class="btn-submit">Lưu</button>
                        <button style="width: 50vh" type="button" class="btn btn-secondary ms-2" onclick="resetForm()">
                            Hủy
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div id="error-message" class="error-message"></div>
    <div th:if="${message}" id="flash-message" th:data-message="${message}"></div>


</div>
<script>
    document.getElementById('register-form').addEventListener('submit', function (event) {
        const password = document.getElementById('password').value;
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        const confirmPassword = document.getElementById('confirmPassword').value;


        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const phoneRegex = /^(03|05|07|08|09)\d{8}$/;

        if (!emailRegex.test(email)) {
            showErrorMessage("Email không hợp lệ!");
            event.preventDefault();
            return;
        }

        if (!phoneRegex.test(phone)) {
            showErrorMessage("Số điện thoại không hợp lệ! Vui lòng nhập đúng định dạng.");
            event.preventDefault();
            return;
        }

        if (password !== confirmPassword) {
            showErrorMessage("Mật khẩu và mật khẩu xác nhận không trùng khớp!");
            event.preventDefault();
            return;
        }
    });


    function showErrorMessage(message) {
        const errorMessageElement = document.getElementById('error-message');
        errorMessageElement.innerText = message;
        errorMessageElement.style.display = "block";

        setTimeout(function () {
            errorMessageElement.style.display = "none";
        }, 3000);
    }

    function togglePassword(id, icon) {
        const field = document.getElementById(id);
        if (field.type === "password") {
            field.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            field.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }

    let originalImageSrc;
    document.addEventListener("DOMContentLoaded", function () {
        const inputImage = document.getElementById("image");
        const previewImage = document.getElementById("preview");
        const flashMessageElement = document.getElementById("flash-message");

        originalImageSrc = previewImage.src;

        inputImage.addEventListener("change", function () {
            const file = this.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    previewImage.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        window.resetForm = function () {
            location.reload();
        };

        const message = flashMessageElement.dataset.message;
        if (message) {
            Swal.fire({
                title: message,
                icon: "success",
                timer: 2000,
                showConfirmButton: false
            });
        }
    });
</script>
</body>
</html>
