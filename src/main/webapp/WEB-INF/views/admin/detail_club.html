<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa CLB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/logout.js"></script>
    <style>
        .header {
            width: 100%;
            margin-left: 10px;
        }

        input.form-control {
            height: 50px;
            font-size: 1.1rem;
        }

        .images {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        img {
            max-width: 150px;
            max-height: 150px;
            margin-top: 5px;
        }

        .form-container {
            max-width: 130vh;
        }

        form input[type="file"] {
            font-size: 1.1rem;
            padding: 10px;
        }

        #preview {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 10px;
        }

        #previews {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .images {
            font-size: 1.5em;
            width: 50vh;
        }

        .text-center {
            margin-top: 10px;
        }

        .file-link {
            font-size: 1.5rem;
            color: #007bff;
            text-decoration: underline;
            font-weight: bold;
        }

        .file-link:hover {
            color: #0056b3;
        }
        .form-control {
            font-size: 1.5rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div style="display: flex; padding: 15px;">
    <div class="nav-3" id="nav-3">
        <nav th:replace="fragments/nav3_admin :: footer"></nav>
    </div>

    <div class="header" style="width: 100%; margin-left: 10px;">
        <header th:replace="fragments/header_admin :: header"></header>

        <div class="container mt-4">
            <h2 class="text-center mb-4">Chi tiết CLB</h2>
            <div style="margin-top: -20px">
                <a th:href="@{'/club/getAllClub'}">
                    <i class="bi bi-arrow-bar-left"></i> Quay lại
                </a>
            </div>

            <form th:object="${club}" method="post" enctype="multipart/form-data"
                  class="mx-auto form-container border rounded p-4 shadow" style="height: 75vh">

                <input type="hidden" th:field="*{club_id}"/>
                <input type="hidden" th:field="*{user.name}"/>

                <div style="display: flex">
                    <div class="images">
                        <div class="mb-4">
                            <label class="form-label">Ảnh đại diện</label>
                            <div class="text-center">
                                <img id="preview" th:src="@{'/uploadFile/' + *{image}}" alt="Ảnh đại diện"
                                     class="img-thumbnail"/>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Ảnh bìa</label>
                            <div class="text-center">
                                <img id="previews" th:src="@{'/uploadFile/' + *{cover_image}}" alt="Ảnh bìa"
                                     class="img-thumbnail"/>
                            </div>
                        </div>

                    </div>
                    <div style="width: 70vh;margin-left: 20px">
                        <div class="mb-5">
                            <label class="form-label">Tên CLB</label>
                            <div th:text="*{name}" class="form-control"></div>
                        </div>

                        <div class="mb-5">
                            <label class="form-label">Loại</label>
                            <div th:text="*{type}" class="form-control"></div>
                        </div>

                        <div class="mb-5">
                            <label class="form-label">Địa chỉ</label>
                            <div th:text="*{address}" class="form-control"></div>
                        </div>

                        <div class="mb-5">
                            <label class="form-label">Trạng thái</label>
                            <div th:text="*{status}" class="form-control"></div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">File hợp đồng</label>
                            <a th:href="@{${club.link_file}}" th:text="${club.link_file}" download></a>
                        </div>

                    </div>
                </div>

            </form>

        </div>
    </div>
</div>
</body>
</html>
