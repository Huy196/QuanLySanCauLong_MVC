<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa người dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/logout.js"></script>
</head>
<body>
<div style="display: flex; padding: 15px;">
    <!-- Sidebar -->
    <div class="nav-3" id="nav-3">
        <nav th:replace="fragments/nav3_admin :: footer"></nav>
    </div>

    <!-- Main content -->
    <div class="header" style="width: 100%; margin-left: 10px;">
        <header th:replace="fragments/header_admin :: header"></header>

        <div class="container mt-4">
            <h2 class="text-center mb-4">Chỉnh sửa người dùng</h2>
            <div style="margin-top: -20px">
                <a th:href="@{'/user/getAllUser'}">
                    <i class="bi bi-arrow-bar-left"></i>Quay lại
                </a>
            </div>
            <form id="editForm" th:action="@{/user/updateUser}" th:object="${user}" enctype="multipart/form-data"
                  method="post"
                  class="mx-auto" style="max-width: 600px;">
                <input type="hidden" th:field="*{user_id}"/>
                <input type="hidden" th:field="*{password}"/>
                <input type="hidden" th:field="*{role}"/>

                <div class="mb-3">
                    <label class="form-label">Ảnh đại diện</label>
                    <div style="text-align: center; display: block">
                        <img id="preview"
                             th:src="@{'/uploadFile/' + *{image}}"
                             style="margin-top:10px;margin-bottom: 10px"
                             alt="Ảnh đại diện"/>

                    </div>
                    <input type="file" name="imageFile" class="form-control mt-2" id="image">
                </div>


                <div class="mb-3">
                    <label for="name" class="form-label">Họ và tên</label>
                    <input type="text" th:field="*{name}" class="form-control" id="name" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control" id="email" required>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Số điện thoại</label>
                    <input type="text" th:field="*{phone}" class="form-control" id="phone" required>
                </div>


                <div class="text-center">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Lưu thay đổi</button>
                    <button type="button" class="btn btn-secondary ms-2" onclick="resetForm()">Hủy</button>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:if="${message}" id="flash-message" th:data-message="${message}"></div>

</body>
</html>
<style>
    .header {
        width: 100%;
        margin-left: 10px;
    }
    #preview {
        width: 150px;
        height: 150px;
        object-fit: cover;
        border-radius: 8px;
        margin-top: 10px;
    }


    form label {
        font-weight: bold;
        font-size: 1.1rem;
    }

    form input[type="text"],
    form input[type="email"],
    form input[type="file"] {
        font-size: 1.1rem;
        padding: 10px;
    }

    .form-control {
        height: 45px;
    }

    .text-center button,
    .text-center a {
        font-size: 1.05rem;
        padding: 10px 20px;
        margin-top: 15px;
    }

    h2.text-center {
        font-size: 2rem;
        font-weight: bold;
    }
</style>

<script>
    let originalImageSrc;
    document.addEventListener("DOMContentLoaded", function () {
        const inputImage = document.getElementById("image");
        const previewImage = document.getElementById("preview");
        const flashMessageElement = document.getElementById("flash-message");

        originalImageSrc = previewImage.src;

        inputImage.addEventListener("change", function () {
            const file = this.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    previewImage.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        window.resetForm = function () {
            location.reload();
        };

        const message = flashMessageElement.dataset.message;
        if (message) {
            Swal.fire({
                title: message,
                icon: "success",
                timer: 2000,
                showConfirmButton: false
            });
        }
    });

</script>
